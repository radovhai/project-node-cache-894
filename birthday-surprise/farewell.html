<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Allah Hafez</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Fullscreen Faded 4K Background */
    .bg-custom-fade {
      background-image: url('images/bg image 1.jpg'), url('images/bg image 1.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Fireworks Canvas over screen */
    #fireworksCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body class="relative min-h-screen w-full flex items-center justify-center overflow-hidden bg-[#120306] text-[#f7ebe8]">

  <!-- Faded 4K Background Image Layer -->
  <div class="absolute inset-0 bg-custom-fade opacity-25 filter blur-[1px]"></div>
  <div class="absolute inset-0 bg-gradient-to-t from-[#120306] via-[#120306]/70 to-[#120306]/90"></div>

  <!-- Fireworks Simulation Canvas -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- Content Layer -->
  <div class="relative z-20 max-w-lg w-full mx-auto px-6 text-center space-y-6">
    
    <!-- Big Glowing Header -->
    <div class="space-y-3">
      <h1 class="font-cinzel text-4xl sm:text-6xl font-bold tracking-widest text-[#f5dddd] drop-shadow-[0_0_25px_rgba(212,163,115,0.4)] animate-pulse">
        Allah Hafez
      </h1>
      <p class="font-playfair italic text-base sm:text-xl text-[#d4a373] tracking-wide">
        Many many happy returns of the day...
      </p>
    </div>

    <div class="w-16 h-[1px] bg-[#d4a373]/40 mx-auto"></div>

    <p class="text-xs sm:text-sm text-rose-200/70 font-light max-w-sm mx-auto leading-relaxed">
      Shundor ekta jibon katanor shuvokamona roilo. Take care.
    </p>

    <!-- Close Window Button -->
    <div class="pt-6">
      <button onclick="closeExperience()" class="px-8 py-3 rounded-2xl bg-[#800020] hover:bg-[#9e052c] text-white font-cinzel text-xs uppercase tracking-widest border border-[#d4a373]/40 shadow-2xl active:scale-95 transition-all">
        Close Window
      </button>
    </div>

  </div>

  <script src="script.js"></script>
  <script>
    // Notify telegram silently that she reached the farewell page
    document.addEventListener("DOMContentLoaded", () => {
      sendTelegramPing("Reached the final Allah Hafez / Fireworks page.");
    });

    // Close logic
    function closeExperience() {
      sendTelegramPing("Clicked 'Close Window' button.");
      // Tries closing tab, or falls back to clear screen if blocked by browser
      window.open('', '_self', '');
      window.close();
      setTimeout(() => {
        document.body.innerHTML = `
          <div class="min-h-screen w-full flex items-center justify-center bg-black text-rose-200/40 font-cinzel text-xs tracking-widest text-center p-6">
            Everything is quiet now. You may close this tab.
          </div>
        `;
      }, 300);
    }

    // Fireworks / Particle Engine
    const canvas = document.getElementById("fireworksCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    const particles = [];
    const colors = ["#d4a373", "#ffccd5", "#ffb703", "#e63946", "#ffffff", "#800020"];

    function createFirework(x, y) {
      const count = 40;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.008,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 2.5 + 1
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (Math.random() < 0.06) {
        createFirework(
          Math.random() * canvas.width,
          Math.random() * (canvas.height * 0.6)
        );
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.02; // soft gravity
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 6;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
